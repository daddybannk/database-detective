<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb8d8"/><stop offset="1" stop-color="#d7e6ef"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a9a5e"/><stop offset="1" stop-color="#5d7a46"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#sky)"/>
  <rect y="455" width="1000" height="245" fill="url(#lawn)"/>

  <!-- distant trees, to keep the scene from reading as a diagram -->
  <g fill="#4e6b43" opacity="0.75">
    <ellipse cx="90" cy="430" rx="95" ry="60"/><ellipse cx="200" cy="445" rx="70" ry="42"/>
    <ellipse cx="880" cy="428" rx="105" ry="62"/><ellipse cx="770" cy="447" rx="65" ry="38"/>
  </g>

  <!-- the house: one storey, white walls, red roof, black door -->
  <rect x="255" y="258" width="490" height="200" fill="#1f2328" opacity="0.18"
        transform="translate(12,10)"/>
  <rect x="255" y="258" width="490" height="200" fill="#f4f1ea" stroke="#c9c2b4" stroke-width="3"/>
  <polygon points="500,128 790,262 210,262" fill="#b5342c"/>
  <polygon points="500,128 790,262 500,262" fill="#9c2a23"/>
  <rect x="204" y="258" width="592" height="14" rx="4" fill="#7e211c"/>
  <rect x="628" y="150" width="46" height="60" fill="#e8e3d9" stroke="#c0b9a9" stroke-width="3"/>

  <!-- windows -->
  <g stroke="#cfc8b9" stroke-width="4">
    <rect x="300" y="305" width="90" height="78" fill="#9ec3d6"/>
    <rect x="612" y="305" width="90" height="78" fill="#9ec3d6"/>
  </g>
  <g stroke="#ffffff" stroke-width="5" opacity="0.85">
    <line x1="345" y1="305" x2="345" y2="383"/><line x1="300" y1="344" x2="390" y2="344"/>
    <line x1="657" y1="305" x2="657" y2="383"/><line x1="612" y1="344" x2="702" y2="344"/>
  </g>

  <!-- door -->
  <rect x="455" y="348" width="92" height="110" fill="#14161a" stroke="#0a0b0d" stroke-width="3"/>
  <circle cx="535" cy="405" r="5" fill="#cbb26a"/>
  <rect x="440" y="340" width="122" height="10" rx="3" fill="#e4dfd4"/>

  <!-- number plate, torn away in the middle: only the 3 and the 13 survive -->
  <g transform="translate(420,286)">
    <rect x="40" y="2" width="82" height="48" fill="#2e271f"/>
    <g fill="#e9e3d3" stroke="#53504a" stroke-width="2.5">
      <path d="M0,0 L50,0 L44,12 L52,25 L42,38 L50,50 L0,50 Z"/>
      <path d="M160,0 L104,0 L110,12 L102,25 L112,38 L104,50 L160,50 Z"/>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#1c1a17">
      <text x="14" y="38">3</text>
      <text x="112" y="38">13</text>
    </g>
  </g>

  <!-- brown picket fence across the foreground -->
  <g fill="#8a5a33" stroke="#6b452674" stroke-width="2">
    <rect x="0" y="536" width="1000" height="13"/>
    <rect x="0" y="592" width="1000" height="13"/>
  </g>
  <g fill="#9a6639" stroke="#6b4526" stroke-width="2">
    <rect x="-6" y="508" width="26" height="120"/><rect x="44" y="508" width="26" height="120"/>
    <rect x="94" y="508" width="26" height="120"/><rect x="144" y="508" width="26" height="120"/>
    <rect x="194" y="508" width="26" height="120"/><rect x="244" y="508" width="26" height="120"/>
    <rect x="294" y="508" width="26" height="120"/><rect x="344" y="508" width="26" height="120"/>
    <rect x="394" y="508" width="26" height="120"/><rect x="444" y="508" width="26" height="120"/>
    <rect x="494" y="508" width="26" height="120"/><rect x="544" y="508" width="26" height="120"/>
    <rect x="594" y="508" width="26" height="120"/><rect x="644" y="508" width="26" height="120"/>
    <rect x="694" y="508" width="26" height="120"/><rect x="744" y="508" width="26" height="120"/>
    <rect x="794" y="508" width="26" height="120"/><rect x="844" y="508" width="26" height="120"/>
    <rect x="894" y="508" width="26" height="120"/><rect x="944" y="508" width="26" height="120"/>
    <rect x="980" y="508" width="26" height="120"/>
  </g>

  <!-- evidence footer, so the clues survive even a bad print -->
  <rect y="646" width="1000" height="54" fill="#15181c" opacity="0.88"/>
  <text x="24" y="669" font-family="'Courier New', monospace" font-size="17" fill="#f0ead9">
    WITNESS PHOTO / SUNRIDGE ESTATES / ONE STOREY
  </text>
  <text x="24" y="690" font-family="'Courier New', monospace" font-size="17" fill="#f0ead9">
    PLATE TORN - BEGINS 3, ENDS 13, DIGITS BETWEEN UNKNOWN
  </text>
</svg>
