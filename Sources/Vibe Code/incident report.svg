<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
  <rect width="700" height="600" fill="#ffffff"/>
  <rect x="20" y="20" width="660" height="560" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="350" y="68" font-size="15" letter-spacing="3" fill="#4a4a4a">OAKFIELD GROUP PLC</text>
    <text x="350" y="106" font-size="28" font-weight="bold" fill="#1a1a1a">SYSTEM INCIDENT REPORT</text>
    <text x="350" y="134" font-size="15" letter-spacing="1" fill="#8d2b22">FILED 9 OCTOBER 2026 AT 19:12</text>
  </g>
  <line x1="56" y1="158" x2="644" y2="158" stroke="#8d2b22" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">
    <text x="56" y="200" fill="#5c574c">Severity</text>
    <text x="240" y="200" font-weight="bold">TOTAL DATA LOSS</text>
    <text x="56" y="232" fill="#5c574c">Filed by</text>
    <text x="240" y="232" font-weight="bold">Head of IT</text>
  </g>

  <line x1="56" y1="258" x2="644" y2="258" stroke="#c4c4c4" stroke-width="2"/>

  <!-- Why one table is left, which is the one thing a player cannot get from
       the data. The schema and an empty result carry the rest of the premise
       between them, so nothing here explains what emp_property is for. -->
  <g font-family="'Courier New', Courier, monospace" font-size="18" fill="#1a1a1a">
    <text x="56" y="296">At 18:41 a migration written by an AI was run</text>
    <text x="56" y="324">against production. Every table was dropped.</text>

    <text x="56" y="372">One survived. The employees table is the old</text>
    <text x="56" y="400">key/value store the migration was written to</text>
    <text x="56" y="428">replace, so the script never reached it.</text>
  </g>

  <line x1="56" y1="454" x2="644" y2="454" stroke="#c4c4c4" stroke-width="2"/>

  <!-- The whole of the case is in these three lines. The role is set in the
       word the system uses, because an IT intern started that same week and
       the only thing separating the two is that this says Junior and means
       it. And `newest` is what turns the eleven IT juniors into one: it names
       an ordering rather than a date, which is as well, since the console has
       no LIMIT and a date would have to be arithmetic off the chat log. -->
  <g font-family="'Courier New', Courier, monospace" font-size="18" fill="#1a1a1a">
    <text x="56" y="492">The account belongs to the <tspan font-weight="bold">newest Junior</tspan> we</text>
    <text x="56" y="520">have taken on in my own department, <tspan font-weight="bold">IT</tspan>. Personnel</text>
    <text x="56" y="548">keep their records in the system that is gone.</text>
  </g>
</svg>
