<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510">
  <rect width="700" height="510" fill="#ffffff"/>
  <rect x="20" y="20" width="660" height="470" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="350" y="72" font-size="26" font-weight="bold" fill="#1a1a1a">SWITCHBOARD TRANSCRIPT</text>
    <text x="350" y="100" font-size="15" letter-spacing="1" fill="#5c574c">CALL LOGGED 8 OCTOBER 2026</text>
  </g>
  <line x1="64" y1="124" x2="636" y2="124" stroke="#8d2b22" stroke-width="3"/>

  <!-- Everything the caller knows, she learned this morning. An earlier draft
       had her remembering the habit from her service years, which cannot be
       right: he only started renaming himself after he fled, so the one fact
       the case turns on had no honest source. He tells her himself instead,
       which also gives him a moment on the page. It says nothing about one a
       year: the warrant carries that rule with its starting year attached, so
       saying it here as well would be the weaker of two copies. The last line
       is the one a player carries to the end, so it is the one set in bold.
       The slip is dated but not timed, and carries no district and no count
       of the years she served: this case is full of years that matter, so a
       figure that does not would read as a clue. The date is the exception
       because it is the one thing that says what year the chain has to reach.
       Knowing where he lives would collapse the registry to a few dozen rows
       and the chain would not be needed. -->
  <g font-family="'Courier New', Courier, monospace" font-size="21" fill="#1a1a1a">
    <text x="64" y="180">I stood behind him in the bus queue this</text>
    <text x="64" y="216">morning. I served under that man. Heavier</text>
    <text x="64" y="252">now, the hair gone, but it is him.</text>

    <text x="64" y="312">He shook my hand and gave me a name I could</text>
    <text x="64" y="348">read on the sign over his shoulder.</text>

    <g font-weight="bold">
      <text x="64" y="408">He laughed and said that is where he gets</text>
      <text x="64" y="444">all of them.</text>
    </g>
  </g>
</svg>
