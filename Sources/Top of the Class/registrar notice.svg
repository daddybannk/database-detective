<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="600" height="360" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="28" y="28" width="584" height="344" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <text x="320" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="23" font-weight="bold" fill="#1a1a1a">GRANTHAM STATE REGISTRAR</text>
  <line x1="70" y1="96" x2="570" y2="96" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="190" y="112" width="260" height="168" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <g font-family="'Courier New', Courier, monospace" font-size="19" fill="#1a1a1a">
    <text x="218" y="142">80 - 100</text><text x="422" y="142" text-anchor="end" font-weight="bold">A</text>
    <text x="218" y="174">70 - 79</text> <text x="422" y="174" text-anchor="end" font-weight="bold">B</text>
    <text x="218" y="206">60 - 69</text> <text x="422" y="206" text-anchor="end" font-weight="bold">C</text>
    <text x="218" y="238">50 - 59</text> <text x="422" y="238" text-anchor="end" font-weight="bold">D</text>
