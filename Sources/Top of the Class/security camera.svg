<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <rect width="900" height="640" fill="#2b2e33"/>

  <!-- blinds on the back wall -->
  <rect x="64" y="96" width="250" height="208" fill="#35383e"/>
  <g stroke="#454951" stroke-width="3">
    <line x1="64" y1="120" x2="314" y2="120"/><line x1="64" y1="144" x2="314" y2="144"/>
    <line x1="64" y1="168" x2="314" y2="168"/><line x1="64" y1="192" x2="314" y2="192"/>
    <line x1="64" y1="216" x2="314" y2="216"/><line x1="64" y1="240" x2="314" y2="240"/>
    <line x1="64" y1="264" x2="314" y2="264"/><line x1="64" y1="288" x2="314" y2="288"/>
  </g>
  <!-- the office door, shut -->
  <rect x="762" y="112" width="116" height="306" fill="#33363c" stroke="#43474e" stroke-width="2"/>
  <circle cx="780" cy="278" r="5" fill="#5a5f67"/>

  <!-- the monitor's glow spilling into the room -->
  <ellipse cx="594" cy="320" rx="236" ry="156" fill="#cdd4c6" opacity="0.07"/>

  <!-- chair back, behind the person -->
  <rect x="236" y="316" width="128" height="150" rx="14" fill="#23262b"/>

  <!-- desk: the top plane, its edge, and the panel below -->
  <rect x="68" y="416" width="764" height="44" fill="#4a4e55"/>
  <rect x="68" y="460" width="764" height="10" fill="#595e66"/>
  <rect x="68" y="470" width="764" height="96" fill="#3a3d43"/>

  <!-- the monitor, standing on the desk, showing the registrar's edit screen -->
  <rect x="574" y="398" width="40" height="18" fill="#1b1d21"/>
  <rect x="546" y="414" width="96" height="9" rx="3" fill="#1b1d21"/>
  <rect x="466" y="230" width="256" height="172" rx="8" fill="#1b1d21" stroke="#6b7078" stroke-width="3"/>
  <rect x="482" y="244" width="224" height="138" fill="#cdd4c6"/>
  <g font-family="'Courier New', Courier, monospace" font-size="12" fill="#23262b">
    <text x="494" y="266" font-weight="bold">REGISTRAR - EDIT GRADE</text>
    <text x="494" y="292">STUDENT</text>
    <text x="494" y="314">COURSE</text>
    <text x="494" y="340">EXAM SCORE</text>
    <text x="494" y="372">GRADE</text>
  </g>
  <rect x="576" y="283" width="116" height="9" fill="#23262b"/>
  <text x="576" y="314" font-family="'Courier New', Courier, monospace" font-size="10"
        fill="#23262b">Software Engineering</text>
  <rect x="576" y="331" width="52" height="9" fill="#23262b" opacity="0.4"/>
  <text x="636" y="340" font-family="'Courier New', Courier, monospace" font-size="10"
        fill="#6b7068">LOCKED</text>
  <rect x="572" y="360" width="60" height="22" fill="none" stroke="#8d2b22" stroke-width="3"/>
  <rect x="582" y="367" width="30" height="9" fill="#8d2b22"/>
  <text x="642" y="376" font-family="'Courier New', Courier, monospace" font-size="10"
        fill="#8d2b22">SAVED</text>

  <!-- keyboard, on the desk in front of the monitor -->
  <rect x="432" y="430" width="186" height="18" rx="4" fill="#5a5f67"/>

  <!-- the person: back to the camera, one hand still on the keys -->
  <path d="M238,500 C238,418 272,382 330,382 C388,382 422,418 422,500 Z" fill="#15171a"/>
  <path d="M404,416 L470,440" fill="none" stroke="#15171a" stroke-width="28" stroke-linecap="round"/>
  <circle cx="330" cy="322" r="50" fill="#15171a"/>
  <path d="M280,322 C280,288 302,268 330,268 C358,268 380,288 380,322 Z" fill="#101215"/>

  <!-- camera overlay -->
  <g font-family="'Courier New', Courier, monospace" font-size="19" fill="#d8dbe0">
    <text x="36" y="52">CAM 02  REGISTRAR OFFICE 4</text>
    <text x="864" y="52" text-anchor="end">WED  23:41:06</text>
  </g>
  <circle cx="852" cy="76" r="8" fill="#8d2b22"/>
  <text x="832" y="83" font-family="'Courier New', Courier, monospace" font-size="19"
        fill="#8d2b22" text-anchor="end">REC</text>

  <!-- the audit figures, printed along the bottom of the still -->
  <rect x="0" y="566" width="900" height="74" fill="#000000" opacity="0.55"/>
  <g xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="19"
     fill="#e6e8eb" text-anchor="middle">
    <text x="450" y="598">450 GRADES ISSUED   12 SCORES ON A CUT-OFF</text>
    <text x="450" y="624">ONE GRADE DISAGREES WITH ITS EXAM SCORE</text>
  </g>
</svg>
