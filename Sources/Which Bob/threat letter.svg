<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620">
  <rect width="700" height="620" fill="#f6f1e4"/>
  <rect x="20" y="20" width="660" height="580" fill="none" stroke="#3a342b" stroke-width="3"/>

  <!-- Typed, because the only thing the letter gives up is a first name. The
       crease across the middle is where it was folded into the envelope. -->
  <line x1="24" y1="320" x2="676" y2="320" stroke="#e7dfcd" stroke-width="6"/>

  <g font-family="'Courier New', Courier, monospace" fill="#24201a">
    <text x="60" y="92" font-size="25" font-weight="bold" letter-spacing="1">TO EVERYONE AT THIS STATION</text>
    <line x1="60" y1="112" x2="470" y2="112" stroke="#8d2b22" stroke-width="2"/>

    <g font-size="19">
      <text x="60" y="166">I gave this place nine years of nights.</text>
      <text x="60" y="200">Last month you took my badge, cleared my</text>
      <text x="60" y="234">locker and scratched my name off the door,</text>
      <text x="60" y="268">and not one of you looked up from your desk.</text>

      <text x="60" y="366">So I am going to deal with every last one of</text>
      <text x="60" y="400">you, in my own time, starting with whoever</text>
      <text x="60" y="434">signed the paper.</text>

      <text x="60" y="492">You know which Bob this is.</text>
    </g>

    <text x="470" y="560" font-size="34" font-weight="bold">- Bob</text>
  </g>
</svg>
