<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect x="40" y="40" width="920" height="920" fill="none" stroke="#2b2b2b" stroke-width="8"/>

  <text x="500" y="196" font-family="Georgia, serif" font-size="96" font-weight="bold"
        fill="#1a1a1a" text-anchor="middle">OUT OF</text>
  <text x="500" y="310" font-family="Georgia, serif" font-size="96" font-weight="bold"
        fill="#1a1a1a" text-anchor="middle">SERVICE</text>
  <line x1="220" y1="360" x2="780" y2="360" stroke="#8d2b22" stroke-width="10"/>

  <!-- The three cassettes the machine counts out of, which is the whole of the
       schema: one column per note. -->
  <g fill="none" stroke="#2b2b2b" stroke-width="6">
    <rect x="200" y="420" width="600" height="140" rx="12"/>
    <rect x="200" y="590" width="600" height="140" rx="12"/>
    <rect x="200" y="760" width="600" height="140" rx="12"/>
  </g>
  <g fill="none" stroke="#8d2b22" stroke-width="3">
    <rect x="216" y="436" width="568" height="108" rx="8"/>
    <rect x="216" y="606" width="568" height="108" rx="8"/>
    <rect x="216" y="776" width="568" height="108" rx="8"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="bold"
     fill="#1a1a1a" text-anchor="middle">
    <text x="500" y="517">1000</text>
    <text x="500" y="687">500</text>
    <text x="500" y="857">100</text>
  </g>
</svg>
