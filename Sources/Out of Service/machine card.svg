<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="620" height="460">
  <rect width="620" height="460" fill="#ffffff"/>
  <rect x="18" y="18" width="584" height="424" fill="none" stroke="#2b2b2b" stroke-width="4"/>

  <text x="310" y="78" font-family="Georgia, serif" font-size="38" font-weight="bold"
        fill="#1a1a1a" text-anchor="middle">CASSETTE CARD</text>
  <text x="310" y="110" font-family="Georgia, serif" font-size="17" letter-spacing="2"
        fill="#4a4a4a" text-anchor="middle">LINDENHALL BANK &#183; ATM NETWORK</text>
  <line x1="60" y1="136" x2="560" y2="136" stroke="#8d2b22" stroke-width="3"/>

  <!-- The three cassettes, and the column each one is counted into. Without
       this card the note values are nowhere in the database, so the case
       cannot be worked at all. Sans for the figures: Georgia sets numerals as
       old-style, so 1000 would read with half its digits below the line. -->
  <g font-size="25" fill="#1a1a1a">
    <text x="60"  y="196" font-family="Helvetica, Arial, sans-serif" font-weight="bold">n1000</text>
    <text x="560" y="196" font-family="Helvetica, Arial, sans-serif" text-anchor="end">$1000 notes</text>
    <text x="60"  y="248" font-family="Helvetica, Arial, sans-serif" font-weight="bold">n500</text>
    <text x="560" y="248" font-family="Helvetica, Arial, sans-serif" text-anchor="end">$500 notes</text>
    <text x="60"  y="300" font-family="Helvetica, Arial, sans-serif" font-weight="bold">n100</text>
    <text x="560" y="300" font-family="Helvetica, Arial, sans-serif" text-anchor="end">$100 notes</text>
  </g>

  <line x1="60" y1="336" x2="560" y2="336" stroke="#2b2b2b" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="19" fill="#1a1a1a" text-anchor="middle">
    <text x="310" y="392">A column holds how many notes were counted out,</text>
    <text x="310" y="420">not the amount.</text>
  </g>
</svg>
